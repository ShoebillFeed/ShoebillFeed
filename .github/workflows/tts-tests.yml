name: TTS service tests

# tts_service/ already had 63 tests, a pytest.ini and a requirements-dev.txt
# -- but no workflow ran them, so they could rot unnoticed.
#
# requirements-dev.txt pulls in requirements.txt, which includes the heavy ML
# stacks (torch, chatterbox, kokoro). The tests mock every engine's library,
# so only the CPU-only torch wheels are needed; installing the CUDA-bundled
# default would blow past the runner's disk.

on:
  push:
    branches: [main]
    paths:
      - "tts_service/**"
      - ".github/workflows/tts-tests.yml"
  pull_request:
    paths:
      - "tts_service/**"
      - ".github/workflows/tts-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tts_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tts_service/requirements-dev.txt

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt

      - name: Run tests
        run: pytest
